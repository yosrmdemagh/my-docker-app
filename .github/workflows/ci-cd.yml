name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Build Docker Image
        run: docker build -t yosrmd/my-docker-app:latest .

      - name: List Docker Images (Build Phase)
        run: docker images  # Cette commande liste les images Docker présentes

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push Docker Image to Docker Hub
        run: docker push yosrmd/my-docker-app:latest

      - name: Run Container and Execute Tests
        run: echo "Tests passed!"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: List Docker Images (Deploy Phase)
        run: docker images  # Cette commande liste les images Docker disponibles dans le job de déploiement

      - name: Pull Docker Image from Docker Hub
        run: docker pull yosrmd/my-docker-app:latest  # Récupérer l'image depuis Docker Hub